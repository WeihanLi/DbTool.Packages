name: dotnetcore

on: [push]

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: dotnet info
      run: dotnet --info
    - name: build
      run: dotnet build.cs
